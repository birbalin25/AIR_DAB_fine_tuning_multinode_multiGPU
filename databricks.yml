# bundle.name and workspace.host below are pinned to literals: Databricks Asset
# Bundles do not support variable interpolation for the auth host, and
# parameterizing the bundle name risks duplicate deployments / broken destroy.
bundle:
  name: air-ray-fsdp-llama-dabs
  databricks_cli_version: ">= 1.20.0"

include:
  - variables.yaml

artifacts:
  code:
    type: tgz
    path: .
    include:
      - src
    # Required: a tgz artifact must name its output path (validation fails
    # without this). ai_runtime_task.code_source_path references the same path.
    files:
      - source: ./dist/code.tgz

# Grant the run_as service principal (per target, via the same variable) access
# to the deployed job AND the bundle's workspace folder. Files under root_path
# are owned by the deploying user, so without this the service principal the job
# runs as cannot read the uploaded entrypoint ("User lacks read access to file:
# /Workspace/<target>/files/command.sh"). DABs applies these permissions to the
# root_path folder; its children (files/, artifacts/) inherit them.
permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.service_principal_application_id}
  # Keep the deploying identity as an explicit manager so future deploys (by this
  # user) retain access to the bundle folder and resources.
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

resources:
  jobs:
    llama_finetuning:
      name: ${var.job_name}
      max_concurrent_runs: ${var.max_concurrent_runs}
      schedule:
        quartz_cron_expression: "${var.schedule_cron_expression}"
        timezone_id: ${var.schedule_timezone_id}
        pause_status: ${var.schedule_pause_status}

      tasks:
        - task_key: train_llama
          environment_key: ${var.environment_key}
          environment_variables_key: ${var.environment_variables_key}
          max_retries: ${var.task_max_retries}
          timeout_seconds: ${var.task_timeout_seconds}
          ai_runtime_task:
            # mlflow_experiment_directory points the experiment at the deploy root,
            # which the top-level permissions block grants the run_as SP CAN_MANAGE.
            # The default location is the *deployer's* /Users folder, which a
            # service-principal run_as cannot write to -> AI Runtime's MLflow run
            # creation fails and the task dies at init with an opaque INTERNAL_ERROR
            # and no logs. Do NOT add mlflow_artifact_location on a dbfs:/Volumes path:
            # that is what crashes AI Runtime at task init (not experiment_directory).
            experiment: ${var.mlflow_experiment_name}
            mlflow_run: ${var.mlflow_run_name}
            mlflow_experiment_directory: ${var.workspace_root_path}
            code_source_path: ${var.code_artifact_path}
            deployments:
              # AI Runtime requires command_path to be absolute under /Workspace/
              # or /Volumes/. It is a per-target literal (var.command_path) that
              # must equal <root_path>/files/command.sh for that target -- e.g.
              # /Workspace/prod/files/command.sh when root_path is /Workspace/prod.
              # See the per-target overrides in variables.yaml.
              - command_path: ${var.command_path}
                compute:
                  accelerator_type: ${var.accelerator_type}
                  accelerator_count: ${var.accelerator_count}

      environments:
        - environment_key: ${var.environment_key}
          spec:
            base_environment: ${var.base_environment}
            dependencies:
              - "${var.dependency_lightning}"
              - "${var.dependency_transformers}"
              - "${var.dependency_accelerate}"
              - "${var.dependency_safetensors}"
              - "${var.dependency_ray}"

      # The AI Runtime job caps environment_variables at 20 entries and each
      # value at 512 characters. Only the small values command.sh reads directly
      # are passed here; training config and the dataset ship inside the code
      # artifact as src/training_config.json and src/training_examples.json.
      environment_variables:
        - environment_variables_key: ${var.environment_variables_key}
          spec:
            variables:
              TRAINING_SCRIPT: "${var.training_script_name}"
              RAY_HEAD_PORT: "${var.ray_head_port}"
              RAY_JOIN_RETRIES: "${var.ray_join_retries}"
              RAY_JOIN_SLEEP_SECONDS: "${var.ray_join_sleep_seconds}"

      # The target-level run_as below applies the service principal to the job.

targets:
  # Three environments share one workspace (same host); each is isolated by its
  # own workspace.root_path and its own run_as service principal. The per-target
  # root_path, command_path, and service principal are set in variables.yaml.
  prod:
    mode: production
    default: true
    workspace:
      host: https://fevm-serverless-stable-14ey07.cloud.databricks.com
      root_path: ${var.workspace_root_path}
    run_as:
      service_principal_name: ${var.service_principal_application_id}

  stage:
    mode: production
    workspace:
      host: https://<stage_host>.azuredatabricks.net
      root_path: ${var.workspace_root_path}
    run_as:
      service_principal_name: ${var.service_principal_application_id}

  test:
    mode: production
    workspace:
      host: https://<test_host>.databricks.com
      root_path: ${var.workspace_root_path}
    run_as:
      service_principal_name: ${var.service_principal_application_id}
