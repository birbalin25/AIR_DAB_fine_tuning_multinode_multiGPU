# AI Runtime CLI run config -- mirrors the DAB ai_runtime_task exactly.
# Submits the SAME training workload (same command.sh, same driver, same JSON
# config/dataset) that the Databricks Asset Bundle deploys, but via the `air`
# CLI, which runs as *you* (the calling user) and streams logs live.
#
# Run from inside this AIR_CLI folder:
#   databricks air run --file air_run.yaml --watch --profile <PROFILE>
#
# Validate only (no submit):   databricks air run --file air_run.yaml --dry-run --profile <PROFILE>
# Scale GPUs for a test run:   add  --override compute.num_accelerators=8   (multiple of 8; 8/node)

# experiment + MLflow run name (same as the DAB ai_runtime_task.experiment / mlflow_run).
# mlflow_experiment_directory and mlflow_artifact_location are intentionally omitted:
# setting an explicit artifact location on a Volume path makes AI Runtime fail at task
# init with no logs (same invariant as the DAB job).
experiment_name: air-ray-fsdp-llama
mlflow_run_name: tinyllama-fsdp-multinode

# Compute: GPU_8xH100 with 24 GPUs -> 3 nodes (same as the DAB default accelerator_count).
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 24

# Python environment. version 6 == the DAB base_environment
# "workspace-base-environments/databricks_ai_v6"; dependencies are identical.
environment:
  version: 6
  dependencies:
    - lightning>=2.4,<2.6
    - transformers>=4.45,<5
    - accelerate>=0.34
    - safetensors>=0.4
    - ray[train]>=2.40

# Same env vars the DAB job sets. Unlike the service-principal DAB job (where these
# are dropped and command.sh self-defaults), the air run is a *user* run, so these
# are actually applied -- the effective values are identical either way.
env_variables:
  TRAINING_SCRIPT: train_llama_ray_fsdp.py
  RAY_HEAD_PORT: "6379"
  RAY_JOIN_RETRIES: "30"
  RAY_JOIN_SLEEP_SECONDS: "5"

# Local code to upload and extract to $CODE_SOURCE_PATH on every node. These are the
# same files the DAB packages (command.sh + the driver + both JSON files).
code_source:
  root_path: .
  include_paths:
    - command.sh
    - train_llama_ray_fsdp.py
    - training_config.json
    - training_examples.json

# Per-node entrypoint == the DAB deployments[].command_path. command.sh runs on every
# node, cds into $CODE_SOURCE_PATH, and branches on NODE_RANK (head on node 0, workers
# elsewhere). AI Runtime injects NODE_RANK/MASTER_ADDR/MASTER_PORT/NUM_NODES/
# LOCAL_WORLD_SIZE/WORLD_SIZE/CODE_SOURCE_PATH just like the DAB path.
command: bash "$CODE_SOURCE_PATH/command.sh"

# == the DAB task_max_retries (1) and task_timeout_seconds (7200s = 120 min).
max_retries: 1
timeout_minutes: 120
